version: '3.9'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0  # Updated to the latest version
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - '9200:9200'
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0  # Use a valid Kibana version
    container_name: kibana
    ports:
      - '5601:5601'  # Default Kibana port
    depends_on:
      - elasticsearch  # Wait for Elasticsearch to be available before starting

